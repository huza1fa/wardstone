services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wardstone
      POSTGRES_USER: ${WARDSTONE_POSTGRES_USER:?set WARDSTONE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${WARDSTONE_POSTGRES_PASSWORD:?set WARDSTONE_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - wardstone-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  wardstone-postgres:
