services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wardstone
      POSTGRES_USER: wardstone_admin
      POSTGRES_PASSWORD: wardstone_admin
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardstone_admin -d wardstone"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - wardstone-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  wardstone-postgres:
