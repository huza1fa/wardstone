access_help:
  # Replace with administrator-owned resource names and actual Google groups.
  # This mapping is context for direct membership reads, not application access proof.
  resources:
    Engineering tools: engineering-tools@example.com

# Ticket field "Vendor" (or an exact requester reply) selects a configured
# resource. These public sources are vendor claims, not independent attestations.
research:
  vendors:
    Tailscale:
      - title: Tailscale security
        url: https://tailscale.com/security
      - title: Tailscale shared responsibility
        url: https://tailscale.com/docs/concepts/shared-responsibility
      - title: Tailscale data processing addendum
        url: https://tailscale.com/dpa
  # Add administrator-owned .md/.txt runbooks relative to this policy file.
  knowledge: {}

capabilities:
  research.vendor.collect:
    mode: allow
  research.knowledge.collect:
    mode: allow
  google.access.inspect:
    mode: allow
  google.users.get:
    mode: allow
  google.users.list_groups:
    mode: allow
  google.groups.get:
    mode: allow
  google.groups.list_members:
    mode: allow
  google.groups.add_member:
    mode: approval
  google.groups.remove_member:
    mode: deny

specialists:
  - name: help_desk
    instructions: >-
      Investigate user-facing operational issues, gather missing facts, and
      hand off confirmed identity or entitlement work to access_management,
      vendor risk reviews to vendor_review, and internal systems or
      documentation questions to systems_knowledge.
      Once a requester identifies a runbook or asks for documented
      troubleshooting instructions, hand off to systems_knowledge immediately.
      Do not keep asking for application identifiers when the requester has
      supplied a named runbook; the knowledge specialist resolves its selector.
      For access inspections, ask only for the exact configured resource name
      when clarification_requirements are present. Escalate immutable selector
      errors to an operator rather than repeatedly questioning the requester.
    collectors:
      - google.users.get
      - google.users.list_groups
    handoff_to:
      - access_management
      - vendor_review
      - systems_knowledge
  - name: access_management
    instructions: >-
      Investigate identity, group membership, licensing, roles, and
      entitlements. Use google.access_request observations for bounded access
      help. Ask for the exact configured resource name when it is absent;
      escalate operator_intervention_required selectors without a follow-up
      loop. Propose google.groups.add_member only for an active user whose
      complete current inspection establishes missing direct membership in
      the configured target group. Never infer effective application access
      or business authorization. Membership removal is outside this workflow.
    collectors:
      - google.access.inspect
      - google.users.get
      - google.users.list_groups
    capabilities:
      - google.groups.add_member
    handoff_to:
      - help_desk
  - name: vendor_review
    instructions: >-
      Prepare bounded, evidence-backed vendor security and risk reviews.
      Do not infer contractual or legal approval, and ask for a specific
      missing vendor artifact when the requester can provide it.
      Collect configured vendor documents using the Vendor selector. Return an
      executive summary, cited findings, deployment assumptions, unknowns, and
      a provisional LOW/MODERATE/HIGH/UNKNOWN risk rating with rationale.
      Attribute vendor claims and escalate unavailable evidence rather than
      treating model training knowledge as research.
    collectors:
      - research.vendor.collect
    handoff_to:
      - help_desk
  - name: systems_knowledge
    instructions: >-
      Answer systems and internal-documentation questions from configured
      read-only evidence, and identify when an operator must supply context.
      Use the Knowledge topic selector or exact requester reply for configured
      runbooks. Cite the documents and separate recommended steps from work
      performed. Missing configured sources require operator escalation.
    collectors:
      - research.knowledge.collect
    handoff_to:
      - help_desk

routing:
  # The model only runs after every structured rule misses. Classification
  # selects a role; role allowlists and capability policy still govern access.
  intent:
    enabled: true
    min_confidence: 0.75
    timeout: 10s
  # Rules run in order and inspect structured Jira fields before any model
  # intent classification. Configure these values to match your Jira project.
  rules:
    - name: jira-access-request
      specialist: access_management
      classification: access_management
      match:
        sources: [jira]
        request_types: [Access request]
    - name: jira-vendor-security-review
      specialist: vendor_review
      classification: vendor_review
      match:
        sources: [jira]
        issue_types: [Service Request]
        labels: [vendor]
        fields:
          Review type: [Security]
    - name: jira-vendor-request
      specialist: vendor_review
      classification: vendor_review
      match:
        sources: [jira]
        request_types: [Vendor review]
    - name: jira-systems-request
      specialist: systems_knowledge
      classification: systems_knowledge
      match:
        sources: [jira]
        request_types: [Systems question]
    - name: jira-systems-question
      specialist: systems_knowledge
      classification: systems_knowledge
      match:
        sources: [jira]
        components: [Internal Systems]
