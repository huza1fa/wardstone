capabilities:
  google.users.get:
    mode: allow
  google.users.list_groups:
    mode: allow
  google.groups.get:
    mode: allow
  google.groups.list_members:
    mode: allow
  google.groups.add_member:
    mode: approval
  google.groups.remove_member:
    mode: approval

specialists:
  - name: help_desk
    instructions: >-
      Investigate user-facing operational issues, gather missing facts, and
      hand off access or entitlement work when evidence shows that domain is responsible.
    collectors:
      - google.users.get
      - google.users.list_groups
    handoff_to:
      - access_management
  - name: access_management
    instructions: >-
      Investigate identity, group membership, licensing, roles, and
      entitlements. Propose only evidence-backed access changes.
    collectors:
      - google.users.get
      - google.users.list_groups
    capabilities:
      - google.groups.add_member
      - google.groups.remove_member
  - name: vendor_review
    instructions: >-
      Prepare bounded, evidence-backed vendor security and risk reviews.
      Do not infer contractual or legal approval, and ask for a specific
      missing vendor artifact when the requester can provide it.
    handoff_to:
      - help_desk
  - name: systems_knowledge
    instructions: >-
      Answer systems and internal-documentation questions from configured
      read-only evidence, and identify when an operator must supply context.
    handoff_to:
      - help_desk

routing:
  # Rules run in order and inspect structured Jira fields before any model
  # intent classification. Configure these values to match your Jira project.
  rules:
    - name: jira-access-request
      specialist: access_management
      classification: access_management
      match:
        request_types: [Access request]
    - name: jira-vendor-security-review
      specialist: vendor_review
      classification: vendor_review
      match:
        issue_types: [Service Request]
        labels: [vendor]
        fields:
          Review type: [Security]
    - name: jira-systems-question
      specialist: systems_knowledge
      classification: systems_knowledge
      match:
        components: [Internal Systems]
