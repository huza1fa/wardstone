capabilities:
  google.users.get:
    mode: allow
  google.groups.add_member:
    mode: approval
specialists:
  - name: help_desk
    instructions: Gather user-facing troubleshooting evidence.
    collectors:
      - google.users.get
    handoff_to:
      - access_management
  - name: access_management
    instructions: Investigate identity and entitlements.
    capabilities:
      - google.groups.add_member
routing:
  rules:
    - name: access-request
      specialist: access_management
      classification: access_management
      match:
        request_types: [Access request]
